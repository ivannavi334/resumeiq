name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run pytest (Python 3.11)
    runs-on: ubuntu-latest

    # Tests use SQLite in-memory via dependency override — no PostgreSQL service needed.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      SECRET_KEY: ci-secret-key-for-testing-purposes-only-32ch
      STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_fake_webhook_secret_ci
      STRIPE_PRICE_ID_PRO: price_pro_test
      STRIPE_PRICE_ID_ENTERPRISE: price_enterprise_test
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=70
