services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/resumeiq
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://vghwmfxbynwyrqzttlos.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnaHdtZnhieW53eXJxenR0bG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzgyMDcsImV4cCI6MjA5MjYxNDIwN30.UvLg1TYIrq1kUPKmdHOI5-YmP7dCoSP4QN6I-LjKXOA}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_PREFIX: ${VITE_API_PREFIX:-/api/v1}
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://vghwmfxbynwyrqzttlos.supabase.co}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnaHdtZnhieW53eXJxenR0bG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzgyMDcsImV4cCI6MjA5MjYxNDIwN30.UvLg1TYIrq1kUPKmdHOI5-YmP7dCoSP4QN6I-LjKXOA}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_API_PREFIX: ${VITE_API_PREFIX:-/api/v1}
    env_file:
      - ./.env
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads:
